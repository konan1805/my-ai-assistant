[project]
name = "my-ai-assistant"
version = "0.1.0"
description = "An agentic AI assistant for web research, task execution, planning, and human-approved actions."
readme = "README.md"
authors = [
    { name = "Arnaud Konan", email = "arnaudkonan369@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "gradio>=6.14.0",
    "langchain>=1.3.4",
    "langchain-community>=0.4.2",
    "langchain-mcp-adapters>=0.2.2",
    "langchain-openai>=1.2.2",
    "langgraph>=1.2.4",
    "pydantic>=2.13.3",
    "python-dotenv>=1.2.2",
    "python-pptx>=1.0.2",
    "requests>=2.33.1",
    "wikipedia>=1.4.0",
]

[project.scripts]
my-ai-assistant = "my_ai_assistant.app:main"

[build-system]
requires = ["uv_build>=0.12.6,<0.13.0"]
build-backend = "uv_build"